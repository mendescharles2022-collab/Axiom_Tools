name: V8 Audit Tooling Tests

on:
  push:
    paths:
      - "scripts/*.py"
      - "config/*.json"
      - "config/*.toml"
      - "tests/test_*.py"
      - ".github/workflows/reconciliation-tests.yml"
  pull_request:
    paths:
      - "scripts/*.py"
      - "config/*.json"
      - "config/*.toml"
      - "tests/test_*.py"
      - ".github/workflows/reconciliation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run audit tooling tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build current V8 preflight
        run: python scripts/build_current_preflight.py --repo-root . --output-dir .audit_artifacts

      - name: Upload current V8 preflight
        uses: actions/upload-artifact@v4
        with:
          name: v8-release-preflight
          path: .audit_artifacts/
          if-no-files-found: error
          retention-days: 30
