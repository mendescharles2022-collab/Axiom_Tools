name: V8 Audit and Runtime Tests

on:
  push:
    paths:
      - "scripts/*.py"
      - "config/*.json"
      - "config/*.toml"
      - "tests/test_*.py"
      - "runtime_overlay/app/src/**/*.py"
      - "runtime_overlay/app/tests/**/*.py"
      - ".github/workflows/reconciliation-tests.yml"
  pull_request:
    paths:
      - "scripts/*.py"
      - "config/*.json"
      - "config/*.toml"
      - "tests/test_*.py"
      - "runtime_overlay/app/src/**/*.py"
      - "runtime_overlay/app/tests/**/*.py"
      - ".github/workflows/reconciliation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run audit tooling tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile versioned runtime overlay
        run: python -m compileall -q runtime_overlay/app/src

      - name: Run executable V8 runtime functional tests
        env:
          PYTHONPATH: runtime_overlay/app/src
        run: |
          python runtime_overlay/app/tests/modules/test_logical_dedup_v8.py -v
          python runtime_overlay/app/tests/modules/test_multi_gfd_composition_v8.py -v
          python runtime_overlay/app/tests/modules/test_output_gate_v8.py -v

      - name: Build current V8 preflight
        run: python scripts/build_current_preflight.py --repo-root . --output-dir audit_artifacts

      - name: Upload current V8 preflight
        uses: actions/upload-artifact@v4
        with:
          name: v8-release-preflight
          path: audit_artifacts/
          if-no-files-found: error
          retention-days: 30
