name: V8 Audit Tooling Tests

on:
  push:
    paths:
      - "scripts/*.py"
      - "scripts/*.ps1"
      - "config/*.json"
      - "config/*.toml"
      - "tests/test_*.py"
      - ".github/workflows/reconciliation-tests.yml"
  pull_request:
    paths:
      - "scripts/*.py"
      - "scripts/*.ps1"
      - "config/*.json"
      - "config/*.toml"
      - "tests/test_*.py"
      - ".github/workflows/reconciliation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke PowerShell B06 producer consumer and plan
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "axiom-runtime-smoke"
          $output = Join-Path $env:RUNNER_TEMP "axiom-handoff-smoke"
          $consumeOutput = Join-Path $env:RUNNER_TEMP "axiom-consume-smoke"
          $invariants = Join-Path $env:RUNNER_TEMP "axiom-smoke-invariants.json"
          $sourceDir = Join-Path $runtime "app/src/pkg"
          $database = Join-Path $runtime "data/operational.sqlite3"
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $database) | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $sourceDir "a.py"), "x = 1`n")
          $env:AXIOM_SMOKE_DB = $database
          python -c "import os, sqlite3; p=os.environ['AXIOM_SMOKE_DB']; c=sqlite3.connect(p); c.execute('CREATE TABLE smoke (id INTEGER PRIMARY KEY, status TEXT NOT NULL)'); c.execute('INSERT INTO smoke(status) VALUES (?)', ('OK',)); c.commit(); c.close()"
          @'
          {
            "version": 1,
            "invariants": [
              {
                "id": "smoke_status",
                "description": "Smoke B06",
                "severity": "error",
                "sql": "SELECT id FROM smoke WHERE status <> 'OK'",
                "max_rows": 10
              }
            ]
          }
          '@ | Set-Content -LiteralPath $invariants -Encoding UTF8
          $pythonExe = (Get-Command python).Source
          ./scripts/BUILD_RUNTIME_HANDOFF_V8.ps1 -RuntimeRoot $runtime -OutputDir $output -PythonExe $pythonExe -Label "ci-v8"
          $handoffDir = Join-Path $output "ci-v8-handoff"
          $manifestPath = Join-Path $handoffDir "RUNTIME_HANDOFF_MANIFEST.json"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Smoke B06 não gerou manifesto."
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.source.database_selection -ne "AUTO_DISCOVERED_SINGLE") {
            throw "Smoke B06 não comprovou autodiscovery inequívoca."
          }
          if ($manifest.source.source_mutation_performed -ne $false) {
            throw "Smoke B06 não comprovou origem intacta."
          }
          if ($manifest.code_export.database_in_code_zip -ne $false) {
            throw "Smoke B06 encontrou banco dentro do ZIP de código."
          }
          Write-Host "POWERSHELL_B06_SMOKE_OK"

          ./scripts/CONSUME_RUNTIME_HANDOFF_V8.ps1 -HandoffDir $handoffDir -RepoRoot $PWD -OutputDir $consumeOutput -PythonExe $pythonExe -Invariants $invariants
          $consumeReportPath = Join-Path $consumeOutput "RUNTIME_HANDOFF_CONSUMPTION.json"
          $planPath = Join-Path $consumeOutput "RECONCILIATION_PLAN.json"
          if (-not (Test-Path -LiteralPath $consumeReportPath -PathType Leaf)) {
            throw "Smoke B06 consumidor não gerou relatório."
          }
          if (-not (Test-Path -LiteralPath $planPath -PathType Leaf)) {
            throw "Smoke B06 consumidor não gerou plano."
          }
          $consumeReport = Get-Content -LiteralPath $consumeReportPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $plan = Get-Content -LiteralPath $planPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($consumeReport.handoff_unchanged -ne $true) {
            throw "Smoke B06 consumidor não preservou o handoff."
          }
          if ($consumeReport.database_preflight_ok -ne $true) {
            throw "Smoke B06 consumidor não concluiu preflight SQLite."
          }
          if ($consumeReport.automatic_reconciliation_write -ne $false -or $plan.automatic_write_allowed -ne $false) {
            throw "Smoke B06 permitiu escrita automática de reconciliação."
          }
          if ($consumeReport.reconciliation_plan_sha256 -ne $plan.plan_sha256) {
            throw "Smoke B06 encontrou divergência no hash do plano."
          }
          if ($consumeReport.v8_homologated -ne $false -or $plan.v8_homologated -ne $false) {
            throw "Smoke B06 consumidor/plano marcaram homologação indevida."
          }
          Write-Host "POWERSHELL_B06_CONSUMER_SMOKE_OK"
          Write-Host "POWERSHELL_B06_PLAN_SMOKE_OK"

      - name: Run audit tooling tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build current V8 preflight
        run: python scripts/build_current_preflight.py --repo-root . --output-dir audit_artifacts

      - name: Upload current V8 preflight
        uses: actions/upload-artifact@v4
        with:
          name: v8-release-preflight
          path: audit_artifacts/
          if-no-files-found: error
          retention-days: 30
