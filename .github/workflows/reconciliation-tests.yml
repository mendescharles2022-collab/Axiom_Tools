name: V8 Audit Tooling Tests

on:
  push:
    paths:
      - "scripts/*.py"
      - "config/*.json"
      - "config/*.toml"
      - "tests/test_*.py"
      - ".github/workflows/reconciliation-tests.yml"
  pull_request:
    paths:
      - "scripts/*.py"
      - "config/*.json"
      - "config/*.toml"
      - "tests/test_*.py"
      - ".github/workflows/reconciliation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run audit tooling tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
